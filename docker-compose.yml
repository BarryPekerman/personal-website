version: '3.8'

services:
  terminal-backend:
    build:
      context: .
      dockerfile: Dockerfile.real-shell
    ports:
      - "8080:8080"
    volumes:
      - ./content:/app/content:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
    networks:
      - terminal-network

networks:
  terminal-network:
    driver: bridge


