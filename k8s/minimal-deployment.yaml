apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-minimal
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-minimal
  template:
    metadata:
      labels:
        app: portfolio-minimal
    spec:
      containers:
      - name: portfolio-minimal
        image: docker.io/library/portfolio-minimal:latest
        ports:
        - containerPort: 8080
          name: http
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-minimal
  namespace: default
spec:
  selector:
    app: portfolio-minimal
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
  type: ClusterIP
