  .profile: |
    # Portfolio Terminal Profile
    export PS1='\[\033[1;32m\]guest@portfolio\[\033[0m\]:\[\033[1;34m\]\w\[\033[0m\]\$ '
    
    # Aliases for easy navigation
    alias cv='cat cv.txt'
    alias resume='cat cv.txt'
    alias contact='cat contact_info.md'
    alias projects='ls -la projects/'
    alias ll='ls -la'
    alias help='echo "Available commands: cv, resume, contact, projects, ls, cat, less, help, clear"'
    
    # Welcome message
    echo "Welcome to the Portfolio Terminal!"
    echo "Type 'help' for available commands or use standard Linux commands."
    echo ""

  project1.md: |
    # 🚀 Kubernetes Portfolio Terminal
    
    **Repository**: https://github.com/[your-username]/portfolio-terminal
    **Status**: Active Development
    **Technologies**: Kubernetes, Go, WebSockets, Docker, Alpine Linux
    
    ## 📋 Project Description
    An interactive terminal-based portfolio that demonstrates advanced DevOps 
    and Platform Engineering skills. Each visitor gets their own isolated 
    Kubernetes pod with a real Linux environment.
    
    ## 🎯 Key Features
    - **Real Isolation**: Each session runs in its own Kubernetes pod
    - **Security First**: Network policies, resource limits, RBAC
    - **Self-Destruct**: Security monitoring with automatic termination
    - **WebSocket Streaming**: Real-time terminal interaction
    - **Professional Content**: CV, projects, and contact info
    
    ## 🛠️ Technical Implementation
    - **Backend**: Go with client-go for Kubernetes API interaction
    - **Frontend**: xterm.js for terminal emulation
    - **Infrastructure**: K3s cluster with custom Alpine images
    - **Security**: Pod Security Standards, NetworkPolicies, ResourceQuotas
    - **Deployment**: GitOps with ArgoCD, Docker multi-stage builds
    
    ## 🏆 Why This Matters
    This project showcases the ability to:
    - Design secure multi-tenant platforms
    - Implement Kubernetes-native applications
    - Handle real-time streaming and WebSocket communication
    - Apply security best practices in container environments
    - Build professional, user-facing technical demonstrations
    
    ## 🔗 Links
    - **Live Demo**: [Your deployment URL]
    - **Source Code**: https://github.com/[your-username]/portfolio-terminal
    - **Documentation**: Comprehensive README with deployment instructions

