apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-backend
  namespace: public-sessions
  annotations:
    nginx.ingress.kubernetes.io/websocket-services: "portfolio-backend"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
spec:
  rules:
  - host: portfolio.yourdomain.com  # Replace with your actual domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: portfolio-backend
            port:
              number: 80
