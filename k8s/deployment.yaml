apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-terminal
  namespace: public-sessions
  labels:
    app: portfolio-terminal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-terminal
  template:
    metadata:
      labels:
        app: portfolio-terminal
    spec:
      serviceAccountName: portfolio-terminal
      containers:
      - name: portfolio-terminal
        image: portfolio-k8s:latest
        imagePullPolicy: Never  # Use local image
        ports:
        - containerPort: 8080
        env:
        - name: KUBERNETES_NAMESPACE
          value: "public-sessions"
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          limits:
            cpu: "500m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-terminal
  namespace: public-sessions
  labels:
    app: portfolio-terminal
spec:
  selector:
    app: portfolio-terminal
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP