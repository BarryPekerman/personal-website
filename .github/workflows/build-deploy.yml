name: Build and Deploy Portfolio

on:
  push:
    branches: [ main, master ]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'web/**'
      - 'manifests/docker/**'
      - 'k8s/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, master ]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/portfolio-backend
  TERMINAL_IMAGE: ghcr.io/${{ github.repository }}/portfolio-terminal

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.BACKEND_IMAGE }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push backend image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./manifests/docker/Dockerfile.backend
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  build-terminal:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.TERMINAL_IMAGE }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push terminal image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./manifests/docker/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    needs: [build-backend, build-terminal]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure kubectl
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG }}

    - name: Deploy to Kubernetes
      run: |
        # Update backend image
        sed -i "s|image: portfolio-backend:latest|image: ${{ env.BACKEND_IMAGE }}:latest|g" k8s/deployment.yaml

        # Update terminal image
        sed -i "s|image: portfolio-terminal:latest|image: ${{ env.TERMINAL_IMAGE }}:latest|g" k8s/deployment.yaml

        # Apply manifests
        kubectl apply -f k8s/namespace.yaml
        kubectl apply -f k8s/rbac.yaml
        kubectl apply -f k8s/resource-quota.yaml
        kubectl apply -f k8s/network-policy.yaml
        kubectl apply -f k8s/configmap.yaml
        kubectl apply -f k8s/service.yaml
        kubectl apply -f k8s/deployment.yaml

        # Wait for rollout
        kubectl rollout status deployment/portfolio-backend -n public-sessions --timeout=300s

    - name: Verify deployment
      run: |
        kubectl get pods -n public-sessions
        kubectl get svc -n public-sessions
        kubectl logs -l app=portfolio-backend -n public-sessions --tail=50
