name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned by commit (a tag can be moved); tools by version, so a
# new linter release can't fail a build that passed yesterday. Bump them on
# purpose, never to "latest".
env:
  GOLANGCI_LINT_VERSION: v2.14.0
  GOVULNCHECK_VERSION: v1.9.0
  PLAYWRIGHT_VERSION: 1.63.0
  IMAGE: ghcr.io/barrypekerman/personal-website

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Latest stable Go, not the go.mod minimum: the minimum's standard
      # library can carry vulnerabilities fixed in later patch releases.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race -cover ./...
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...

  # The site in a real browser, at desktop and phone sizes: fails on any
  # console error (a CSP violation is one), page error or failed request, or
  # when the terminal or the phone layout doesn't work. Screenshots are
  # uploaded either way.
  page:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install Playwright and Chromium
        run: |
          pip install "playwright==${PLAYWRIGHT_VERSION}"
          playwright install --with-deps chromium
      - name: Start the server
        run: |
          go build -o portfolio ./cmd/server
          DEV_VISITOR=IL/TLV ./portfolio > server.log 2>&1 &
          for _ in $(seq 30); do curl -fs http://localhost:8080/healthz && exit 0; sleep 1; done
          cat server.log; exit 1
      - name: Check the pages
        run: python scripts/pagecheck.py http://localhost:8080 screenshots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: |
            screenshots/
            server.log
          retention-days: 14

  # Every build is scanned (Grype, failing on high or critical vulnerabilities
  # that have a fix). Pull requests stop there; main also pushes the image to
  # GHCR, tagged with the commit SHA only (what the cluster deploys; no
  # :latest), with an SBOM and provenance attached, and signs it with cosign
  # (keyless, through GitHub's OIDC identity).
  image:
    runs-on: ubuntu-24.04
    needs: [go, page]
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build for the scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          build-args: COMMIT=${{ github.sha }}
          load: true
          tags: portfolio:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: portfolio:scan
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: push
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: COMMIT=${{ github.sha }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name == 'push'
      - name: Sign the image
        if: github.event_name == 'push'
        # By digest: the signature covers exactly what was pushed. Check it with
        #   cosign verify ghcr.io/barrypekerman/personal-website:<sha> \
        #     --certificate-identity-regexp '^https://github.com/BarryPekerman/personal-website/' \
        #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"
