name: GHCR retention

# CI pushes ghcr.io/barrypekerman/personal-website:<sha> on every merge to
# main, and GHCR keeps them all forever. This keeps the newest KEEP tagged
# images and deletes the rest. Each tag is a multi-arch index with platform
# children, buildx attestations (SBOM, provenance) and a cosign signature
# (a sha256-<digest> tag); the action counts and deletes those with their
# parent, so a kept tag is never left half-pulled or unsigned. CI no longer
# pushes :latest; the last image tagged so ages out like any other.
#
# The deployed tag (oke-gitops portfolio/deployment.yaml) is normally the
# newest, so it's always kept unless a rollback pins something older than
# KEEP images ago. Deleted images can be rebuilt from their commit.
#
# Manual run: gh workflow run ghcr-retention.yml -R BarryPekerman/personal-website -f dry-run=true
on:
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Only log what would be deleted"
        type: boolean
        default: true

concurrency: ghcr-retention

permissions:
  packages: write

env:
  KEEP: 10

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: personal-website
          keep-n-tagged: ${{ env.KEEP }}
          delete-untagged: true
          delete-orphaned-images: true
          delete-partial-images: true
          validate: true
          # scheduled runs delete; manual runs default to a dry run
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
