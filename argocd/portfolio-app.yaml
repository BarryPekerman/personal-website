apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portfolio-terminal
  namespace: argocd
  labels:
    app: portfolio-terminal
spec:
  project: default
  source:
    repoURL: https://github.com/your-username/portfolio-terminal
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: public-sessions
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
  revisionHistoryLimit: 10
