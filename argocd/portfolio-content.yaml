apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portfolio-content
  namespace: argocd
  labels:
    app: portfolio-content
spec:
  project: default
  source:
    repoURL: https://github.com/your-username/portfolio-terminal
    targetRevision: HEAD
    path: content
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: public-sessions
  syncPolicy:
    automated:
      prune: false  # Don't delete content automatically
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - PrunePropagationPolicy=foreground
  revisionHistoryLimit: 5
